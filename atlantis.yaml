version: 3
automerge: false
parallel_plan: true
parallel_apply: true

projects:
  - name: aws-opensearch-module-basic
    dir: examples/basic
    workspace: default
    terraform_version: ">= 1.0"
    autoplan:
      when_modified:
        - "*.tf"
        - "../../*.tf"
      enabled: true
    apply_requirements:
      - approved
      - mergeable

  - name: aws-opensearch-module-complete
    dir: examples/complete
    workspace: default
    terraform_version: ">= 1.0"
    autoplan:
      when_modified:
        - "*.tf"
        - "../../*.tf"
      enabled: true
    apply_requirements:
      - approved
      - mergeable

  - name: aws-opensearch-module-vpc
    dir: examples/vpc
    workspace: default
    terraform_version: ">= 1.0"
    autoplan:
      when_modified:
        - "*.tf"
        - "../../*.tf"
      enabled: true
    apply_requirements:
      - approved
      - mergeable
